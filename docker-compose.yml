name: pulseops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pulseops_pg:/var/lib/postgresql/data
volumes:
  pulseops_pg:
