[project]
name = "pulseops-oie"
version = "0.1.0"
description = "Operational Intelligence Engine powering PulseOps"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "httpx2>=2.12.0",
]

[tool.uv.workspace]
members = ["packages/oie_core", "apps/api"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["packages/oie_core/src", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages/oie_core/tests", "apps/api/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["oie_core"]
mypy_path = "packages/oie_core/src"
